<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17384f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="EMC TS CEM"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>EMC TS CONSULTING – Déclinaison CEM</title></head><body><header><h1>EMC TS CONSULTING</h1><p>Déclinaison CEM • PWA V0.1</p></header><main><div id="diag" class="ok">Démarrage du moteur…</div><section><h2>Balayage BCI / CS114</h2><div class="grid"><label>Courant BCI (mA)<input id="I" type="number" value="100"></label><label>ZCM (Ω)<input id="Z" type="number" value="50"></label><label>Début (MHz)<input id="f0" type="number" value="0.25"></label><label>Fin (MHz)<input id="f1" type="number" value="200"></label><label>Points<input id="np" type="number" value="1000"></label><label>Échelle<select id="scale"><option value="log">Logarithmique</option><option value="lin">Linéaire</option></select></label></div></section><section><h2>Faisceau / câble</h2><div class="grid"><label>Configuration<select id="shield"><option value="yes">Blindé</option><option value="no">Non blindé</option></select></label><label>Longueur (m)<input id="L" type="number" value="1"></label><label>VF<input id="vf" type="number" value="0.70" step="0.01"></label><label>λ/4 théorique<div id="qtr" class="read">—</div></label></div></section><section id="shieldSec"><h2>Blindage</h2><div class="grid"><label>Méthode<select id="method"><option value="db">Atténuation effective</option><option value="zt">ZT</option></select></label><label id="attWrap">Atténuation (dB)<input id="att" type="number" value="12"></label><label id="ztWrap" class="hide">ZT (mΩ/m)<input id="zt" type="number" value="10"></label><label id="bciWrap" class="hide check"><input id="useBci" type="checkbox" checked> Utiliser le courant BCI injecté</label><label id="ishWrap" class="hide">Courant blindage mesuré (mA)<input id="ish" type="number" value="100"></label></div></section><section><h2>Interface / carte</h2><div class="grid"><label>Connecteur (dB)<input id="conn" type="number" value="0"></label><label>Filtre (dB)<input id="filter" type="number" value="20"></label><label>Mode carte<select id="cmode"><option value="det">Valeur à déterminer</option><option value="known">Seuil connu</option></select></label><label id="limWrap" class="hide">Seuil carte (mV)<input id="limit" type="number" value="10"></label></div></section><div class="buttons"><button id="calc">Recalculer</button><button id="reset" class="alt">Nouveau calcul</button><button id="client" class="alt">Fiche client</button></div><section><h2>Résultat</h2><div class="cards"><div>Maximum<b id="max">—</b></div><div>1er λ/4<b id="crit">—</b></div><div>Marge<b id="margin">—</b></div></div><div class="chart"><svg id="chart" viewBox="0 0 1000 420" aria-label="Graphe du niveau carte"></svg></div><p class="small">Axe Y : dBµV. Les repères λ/4 sont des repères théoriques de longueur électrique, pas des résonances garanties.</p></section></main><script src="app.js"></script></body></html>
